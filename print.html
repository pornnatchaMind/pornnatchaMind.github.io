<html>
    <head>
        <title>Raster Data</title>
    </head>
    <body>

<canvas id="canvas" width="220" height="220"
style="width:500px; height:500px; border:2px solid rgb(0, 0, 0); image-rendering: pixelated;">
</canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const data = imageData.data;
 // Array of color [R,G,B,A, R,G,B,A, ...]


function putPixel(x,y,r,g,b,a=255){
    const idx = (y*canvas.width+x)*4;
    data[idx]=r;
    data[idx+1]=g;
    data[idx+2]=b;
    data[idx+3]=a;
}


function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}

function drawbushLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putThickPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putThickPixel(x, y, r, g, b, a);
    }
  }
}

function drawRect(x1, y1, x2, y2,r, g, b, a = 255) {
  drawLine(x1, y1, x2, y1, r, g, b, a); // Top edge
  drawLine(x2, y1, x2, y2, r, g, b, a); // Right edge
  drawLine(x2, y2, x1, y2, r, g, b, a); // Bottom edge
  drawLine(x1, y2, x1, y1, r, g, b, a); // Left edge
}


  function drawRectRot(x1, y1, x2, y2, degree,r, g, b, a = 255) {
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      const w = Math.abs(x2 - x1);
      const h = Math.abs(y2 - y1);

      const rad = (degree * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);

      const hw = w / 2;
      const hh = h / 2;

      const corners = [
        { x: -hw, y: -hh },
        { x: hw, y: -hh },
        { x: hw, y: hh },
        { x: -hw, y: hh }
      ];

      const pts = corners.map(p => ({
        x: Math.round(cx + (p.x * cos - p.y * sin)),
        y: Math.round(cy + (p.x * sin + p.y * cos))
      }));
      
      drawLine(pts[0].x, pts[0].y, pts[1].x, pts[1].y, r, g, b, a);
      drawLine(pts[1].x, pts[1].y, pts[2].x, pts[2].y, r, g, b, a);
      drawLine(pts[2].x, pts[2].y, pts[3].x, pts[3].y, r, g, b, a);
      drawLine(pts[3].x, pts[3].y, pts[0].x, pts[0].y, r, g, b, a);
      }

 function drawRectRotFilled(x1, y1, x2, y2, deg, r, g, b, a = 255) {
  const cx = (x1 + x2) / 2;
  const cy = (y1 + y2) / 2;
  const hw = Math.abs(x2 - x1) / 2;
  const hh = Math.abs(y2 - y1) / 2;

  const rad = (deg * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);

  const corners = [
    { x: -hw, y: -hh },
    { x: hw, y: -hh },
    { x: hw, y: hh },
    { x: -hw, y: hh }
  ];

  const pts = corners.map(p => ({
    x: Math.round(cx + (p.x * cos - p.y * sin)),
    y: Math.round(cy + (p.x * sin + p.y * cos))
  }));

  const minY = Math.min(...pts.map(p => p.y));
  const maxY = Math.max(...pts.map(p => p.y));


  for (let y = minY; y <= maxY; y++) {
    let nodes = [];
      for (let i = 0; i < 4; i++) {
        const p1 = pts[i];
        const p2 = pts[(i + 1) % 4];

      if ((p1.y <= y && p2.y > y) || (p2.y <= y && p1.y > y)) {
        const intersectX = Math.round(p1.x + ((y - p1.y) / (p2.y - p1.y)) * (p2.x - p1.x));
        nodes.push(intersectX);
      }
    }
      if (nodes.length >= 2) {
        nodes.sort((a, b) => a - b);
          for (let x = nodes[0]; x <= nodes[1]; x++) {
            putPixel(x, y, r, g, b, a);
      }
    }
  }
}

  function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
    for (let y = y1; y <= y2; y++) {
      for (let x = x1; x <= x2; x++) {
        putPixel(x, y, r, g, b, a);
       }
     }
  }
function drawEllipse(x1, y1, x2, y2, r, g, b, a = 255) {
  const steps = Math.max(x2, y2) * 10; 
  for (let i = 0; i < steps; i++) {
    const theta = (i / steps) * (2 * Math.PI);
    const x = Math.round(x1 + x2 * Math.cos(theta));
    const y = Math.round(y1 + y2 * Math.sin(theta));
    //putThickPixel(x, y, r, g, b, a); 
    putPixel(x,y,r,g,b,a);
  }
}

function drawEllipseFilled(x1, y1, x2, y2, r, g, b, a = 255) {
  for (let y = -y2; y <= y2; y++) {
    for (let x = -x2; x <= x2; x++) {
      if ((x * x) / (x2 * x2) + (y * y) / (y2 * y2) <= 1) {
          putPixel(x1 + x, y1 + y, r, g, b, a);

      }
    }
  }
}

//=======================================================

        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;

        let startX = 0; 
        let startY = 0;
        let snapshotData = new Uint8ClampedArray(canvas.width * canvas.height * 4);

        let r = 0 ;
        let g = 0;
        let b = 0;
        let mouseX ;
        let mouseY ;
        let degree = 0;
        let brushSize = 1;

        let RectX = 100;
        let RectY = 100;
        let RectR = 10;
        let isDrawingRect = false;
        let currentTool = 'brush';

function putThickPixel(x,y,r,g,b,a = 255 ) {
            const bs = Math.floor(brushSize / 2) ;

          for ( let dy = -bs ; dy <= bs ; dy++) {
            for ( let dx = -bs ; dx <= bs ; dx++){
              const px = x + dx;
              const py = y + dy

              if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                putPixel(px, py, r, g, b, a);
              }
          }
        }
      }

function drawThickRect(x1, y1, x2, y2, r, g, b, a = 255) {
  drawbushLine(x1, y1, x2, y1, r, g, b, a); // ขอบบน
  drawbushLine(x2, y1, x2, y2, r, g, b, a); // ขอบขวา
  drawbushLine(x2, y2, x1, y2, r, g, b, a); // ขอบล่าง
  drawbushLine(x1, y2, x1, y1, r, g, b, a); // ขอบซ้าย
}

function drawThickRectRot(x1, y1, x2, y2, degree, r, g, b, a = 255) {
  const cx = (x1 + x2) / 2;
  const cy = (y1 + y2) / 2;
  const w = Math.abs(x2 - x1);
  const h = Math.abs(y2 - y1);
  const rad = (degree * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const hw = w / 2;
  const hh = h / 2;
  const corners = [
    { x: -hw, y: -hh }, { x: hw, y: -hh },
    { x: hw, y: hh }, { x: -hw, y: hh }
  ];
  const pts = corners.map(p => ({
    x: Math.round(cx + (p.x * cos - p.y * sin)),
    y: Math.round(cy + (p.x * sin + p.y * cos))
  }));
  drawbushLine(pts[0].x, pts[0].y, pts[1].x, pts[1].y, r, g, b, a);
  drawbushLine(pts[1].x, pts[1].y, pts[2].x, pts[2].y, r, g, b, a);
  drawbushLine(pts[2].x, pts[2].y, pts[3].x, pts[3].y, r, g, b, a);
  drawbushLine(pts[3].x, pts[3].y, pts[0].x, pts[0].y, r, g, b, a);
}

function drawThickEllipse(x1, y1, x2, y2, r, g, b, a = 255) {
  const steps = Math.max(x2, y2) * 10; 
  for (let i = 0; i < steps; i++) {
    const theta = (i / steps) * (2 * Math.PI);
    const x = Math.round(x1 + x2 * Math.cos(theta));
    const y = Math.round(y1 + y2 * Math.sin(theta));
    putThickPixel(x, y, r, g, b, a);
  }
}

function toScaledMouseCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: Math.floor((clientX - rect.left) * scaleX),
                y: Math.floor((clientY - rect.top) * scaleY)
            };
        }

canvas.addEventListener('click', function (event) {
            const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
            if(x >= 2 && x <= 12) {
              if (y >= 10 && y <= 20) {
                r = 255; g = 0; b = 0; // Change to red
              }else if (y >= 25 && y <= 35) {
                r = 0; g = 0; b = 255;
              }else if (y >= 40 && y <= 50) {
                r = 255; g = 255; b = 255;
              }else if (y >= 55 && y <= 65) {
                r = 0; g = 150; b = 255;
              }else if (y >= 70 && y <= 80) {
                r = 128; g = 0; b = 125;
              }
            }else if (x >= 15 && x <= 25){
              if (y >= 10 && y <= 20) {
                r = 0; g = 255; b = 0;
              }else if (y >= 25 && y <= 35) {
                r = 0; g = 0; b = 0;
              }else if (y >= 40 && y <= 50) {
                r = 125; g = 0; b = 0;
              }else if (y >= 55 && y <= 65) {
                r = 255; g = 105; b = 180;
              }else if (y >= 70 && y <= 80) {
                r = 255; g = 255; b = 0;
              }
            }
            if (x >= 2 && x <= 12) {
                if (y >= 85 && y <= 95) {
                  currentTool = 'circle'; // วงกลม
                } else if (y >= 100 && y <= 115) {
                  currentTool = 'rectRot'; // สี่เหลี่ยมหมุน
                  }
                } if (x >= 15 && x <= 25) {// คอลัมน์ขวา
                    if (y >= 85 && y <= 95) {
                      currentTool = 'rect'; // สี่เหลี่ยมจัตุรัส
                      }
                    }if(x >= 23 && x <= 24) { 
                      if (y >= 119 && y <= 132) {
                          currentTool = 'brush'; // ดินสอ
                      }
                    }if (x >= 22 && x <= 25){
                      if (y >= 119 && y <= 122){
                        currentTool = 'brush'; // ก้นดินสอ
                      }
                    }
                  
                    if (x >= 2 && x <= 15){
                        if (y >= 120 && y <= 128) {
                            currentTool = 'eraser'
                    }
                  }if (x >= 7 && x <= 15){
                        if (y >= 120 && y <= 128) {
                            currentTool = 'eraser'
                        }
                      }if (x >= 20 && x <= 24) {
                          if (y >= 100 && y <= 115) {
                              currentTool = 'line';
                      }
                    }
  previousMouseX = x; 
  previousMouseY = y;
  ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mousedown', function (event) {
  const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    if (x > 30) { 
        if (currentTool === 'circle') {
            isDragging = true;
            startX = x;
            startY = y;
            snapshotData.set(imageData.data);
        } else if (currentTool === 'rectRot') {
            isDragging = true;
            startX = x;
            startY = y;
            snapshotData.set(imageData.data);
        } else if (currentTool === 'rect') {
            isDragging = true;
            startX = x;
            startY = y;
            snapshotData.set(imageData.data);
        } else if (currentTool === 'brush') {
            isDragging = true;
            previousMouseX = x; 
            previousMouseY = y;
            putThickPixel(x, y, r, g, b, 255);
            ctx.putImageData(imageData, 0, 0);
        }else if (currentTool === 'eraser') {
            isDragging = true;
            previousMouseX = x; 
            previousMouseY = y;
            putThickPixel(x, y, 255,255, 255);
              ctx.putImageData(imageData, 0, 0);
        }else if (currentTool === 'line') {
            isDragging = true;
            startX = x;
            startY = y;
            snapshotData.set(imageData.data); 
        }
    }
    
})

canvas.addEventListener('mousemove', function (event) {
            const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
            if (isDragging && x > 30) {
        
        if (currentTool === 'eraser') {
            drawbushLine(previousMouseX, previousMouseY, x, y, 255, 255, 255, 255);
            previousMouseX = x;
            previousMouseY = y;
            
        }else if (currentTool === 'circle') {
            imageData.data.set(snapshotData);
        
            const cx = Math.round((startX + x) / 2);
            const cy = Math.round((startY + y) / 2);
            const rx = Math.round(Math.abs(x - startX) / 2);
            const ry = Math.round(Math.abs(y - startY) / 2);
            
            if (rx > 0 && ry > 0) {
                drawThickEllipse(cx, cy, rx, ry, r, g, b);
            }
          }else if (currentTool === 'rect') {
            imageData.data.set(snapshotData);
            
            const rx1 = Math.min(startX, x);
            const ry1 = Math.min(startY, y);
            const rx2 = Math.max(startX, x);
            const ry2 = Math.max(startY, y);
            
            if (rx2 > rx1 && ry2 > ry1) {
                drawThickRect(rx1, ry1, rx2, ry2, r, g, b); 
            }

        } else if (currentTool === 'rectRot') {
            imageData.data.set(snapshotData);
            
            const rx1 = Math.min(startX, x);
            const ry1 = Math.min(startY, y);
            const rx2 = Math.max(startX, x);
            const ry2 = Math.max(startY, y);
            
            if (rx2 > rx1 && ry2 > ry1) {
                drawThickRectRot(rx1, ry1, rx2, ry2, 140, r, g, b); // ขอบดำ
            }
            
        } else if (currentTool === 'line') {
            imageData.data.set(snapshotData);
            drawbushLine(startX, startY, x, y, r, g, b);
        } else {
            drawbushLine(previousMouseX, previousMouseY, x, y, r, g, b);
            previousMouseX = x;
            previousMouseY = y;
        }
                ctx.putImageData(imageData, 0, 0);
            }
          });

canvas.addEventListener('mouseup', function (event) {
            isDragging = false;
            const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
            ctx.putImageData(imageData, 0, 0);
        });

window.addEventListener('keydown', function (event) {
            console.log('keydown', event.key)
              if(event.key === '+' || event.key === '=' || event.key === 'ช') {
               brushSize = Math.min(brushSize + 2, 100);
               RectR = Math.min(RectR + 2, 100);
                console.log('Brush Size:', brushSize);
                console.log('RectR:', RectR);
                return true ;
              }
              if(event.key === '-' || event.key === '_' || event.key === '=' || event.key === 'ข') {
                brushSize = Math.max(brushSize - 2, 1);
                RectR = Math.max(RectR - 2, 1);
                onsole.log('Brush Size:', brushSize);
                console.log('RectR:', RectR);

                return true ;
            }
          })
          
// ===================================================================

window.addEventListener('keyup', function (event) {
            console.log('keyup', event.key)
        })
function animate() {
      
  //=========================
    drawRectFilled(0, 0, 220, 5, 170, 170, 170 , 125) // แทบเทาบน
    drawRectFilled(0, 0, 30, 220, 170, 170, 170 , 125) // แทบเทาซ้าย

    drawRectFilled(1, 6, 28, 135, 200, 200, 200 , 100) // แทบขาวซ้าย

    drawRectFilled(0, 215, 220, 220, 170, 170, 170, 125) // แทบเทาล่าง
    drawRectFilled(215, 0, 220, 220, 170, 170, 170, 125) // แทบเทาขวา


    // ============================
    drawRectFilled(2, 10, 12, 20, 255, 0, 0) // red
    drawRectFilled(15, 10, 25, 20, 0, 255, 0) // green

    drawRectFilled(2, 25, 12, 35, 0, 0, 255) // blue
    drawRectFilled(15, 25, 25, 35, 0, 0, 0) // black

    drawRectFilled(2, 40, 12, 50, 255, 255, 255) //white
    drawRectFilled(15, 40, 25, 50, 125 , 0 ,0 ) // brown

    drawRectFilled(2, 55, 12, 65, 0, 150, 255) // S
    drawRectFilled(15, 55, 25, 65, 255, 105 ,180)// P

    drawRectFilled(2, 70, 12, 80, 128, 0, 125) // PP
    drawRectFilled(15, 70, 25, 80, 255 , 255 ,0)// Y

    // ===================

    drawRect(2, 10, 12, 20, 0, 0, 0) // กรอบสี่เหลี่ยม R
    drawRect(15, 10, 25, 20, 0, 0, 0) // กรอบสี่เหลี่ยม G
    
    drawRect(2, 25, 12, 35, 0, 0, 0)// กรอบสี่เหลี่ยม B
    drawRect(15, 25, 25, 35, 0, 0, 0)// กรอบสี่เหลี่ยม BL

    drawRect(2, 40, 12, 50, 0, 0, 0) // กรอบสี่เหลี่ยม W
    drawRect(15, 40, 25, 50, 0 , 0 ,0)// กรอบสี่เหลี่ยม BR

    drawRect(2, 55, 12, 65, 0, 0, 0) // กรอบสี่เหลี่ยม S
    drawRect(15, 55, 25, 65, 0 , 0 ,0)// กรอบสี่เหลี่ยม P

    drawRect(2, 70, 12, 80, 0, 0, 0) // กรอบสี่เหลี่ยม PP
    drawRect(15, 70, 25, 80, 0 , 0 ,0)// กรอบสี่เหลี่ยม Y



// ==========================
      drawRectFilled(15, 85, 25, 95, 0, 0, 0) 
      drawRectRotFilled(2, 100, 12,110, 140,0, 0, 0) 
      drawEllipseFilled(7, 90, 5, 5, 0, 0, 0)

      drawRectFilled(2 ,120, 15, 128, 255 , 255 , 255) // สียางลบ
      drawRectFilled(7 ,120, 15, 128, 125 , 125 , 125) //สีปลอกยางลบ
//===========================    
      drawRectRotFilled(20, 100, 24, 115,40,0, 0, 0) // สีเส้น
      drawRectRot(20, 100, 24, 115,40,0, 0, 0) // กรอบเส้น
//============================
      drawEllipse(7, 90, 5, 5, 0, 0, 0) // ขอบวงกลม
      drawRectRot(2, 100, 12,110, 140,0, 0, 0) //หมุนสีเหลี่ยม
      drawRect(15 ,85, 25, 95, 0 , 0 , 0)// กรอบสี่เหลี่ยม
 //==================     
        drawRect(7 ,120, 15, 128, 0 , 0 , 0) // ปลอกยางลบ
        drawRect(2 ,120, 15, 128, 0 , 0 , 0) // ยางลบ
//=================
        drawRectFilled(23, 119, 24, 132, 125, 0, 0,125); // สีดินสอ
        drawRect(22, 119, 25, 132, 0, 0,0); // // กรอบดินสอ
        drawRectFilled(22, 119, 25, 122, 255, 255, 255); // สีก้นดินสอ
        drawRect(22, 119, 25, 122, 0, 0,0); // // กรอบ ก้นดินสอ
        



  requestAnimationFrame(animate);
  ctx.putImageData(imageData, 0, 0);
}
animate();
</script>
